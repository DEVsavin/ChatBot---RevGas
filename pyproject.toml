[project]
name = "revgas-chatbot"
version = "0.1.0"
description = "Chatbot de pedidos de gás integrado à API da RevGás (Projeto de Extensão VI)"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/revgas_chatbot"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
